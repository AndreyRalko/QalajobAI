# QalaJob AI — nginx (Django monolith)
# Install: sudo cp deploy/nginx/qalajob.conf /etc/nginx/sites-available/qalajob
#          sudo ln -s /etc/nginx/sites-available/qalajob /etc/nginx/sites-enabled/
#          sudo nginx -t && sudo systemctl reload nginx
#
# Replace qalajob.example.com and certificate paths.
# Upstream: Waitress on 127.0.0.1:8088 (UI + API)

upstream qalajob_app {
    server 127.0.0.1:8088;
    keepalive 32;
}

server {
    listen 80;
    listen [::]:80;
    server_name qalajob.example.com;

    location /.well-known/acme-challenge/ {
        root /var/www/certbot;
    }

    location / {
        return 301 https://$host$request_uri;
    }
}

server {
    listen 443 ssl http2;
    listen [::]:443 ssl http2;
    server_name qalajob.example.com;

    ssl_certificate     /etc/letsencrypt/live/qalajob.example.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/qalajob.example.com/privkey.pem;

    client_max_body_size 25m;

    location /static/ {
        alias /opt/QalajobAI/backend/staticfiles/;
        expires 7d;
        access_log off;
    }

    location /media/ {
        alias /opt/QalajobAI/backend/media/;
        expires 1d;
    }

    location / {
        proxy_pass http://qalajob_app;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Connection "";
        proxy_read_timeout 300s;
    }
}
