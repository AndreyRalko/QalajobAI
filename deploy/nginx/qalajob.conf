# QalaJob AI — nginx reverse proxy
# Install: sudo cp deploy/nginx/qalajob.conf /etc/nginx/sites-available/qalajob
#          sudo ln -s /etc/nginx/sites-available/qalajob /etc/nginx/sites-enabled/
#          sudo nginx -t && sudo systemctl reload nginx
#
# Replace qalajob.example.com and certificate paths.
# API upstream: Waitress/Gunicorn on 127.0.0.1:8088
# Web upstream: Next.js on 127.0.0.1:3001

upstream qalajob_api {
    server 127.0.0.1:8088;
    keepalive 32;
}

upstream qalajob_web {
    server 127.0.0.1:3001;
    keepalive 32;
}

server {
    listen 80;
    listen [::]:80;
    server_name qalajob.example.com;

    # ACME / Let's Encrypt
    location /.well-known/acme-challenge/ {
        root /var/www/certbot;
    }

    location / {
        return 301 https://$host$request_uri;
    }
}

server {
    listen 443 ssl http2;
    listen [::]:443 ssl http2;
    server_name qalajob.example.com;

    ssl_certificate     /etc/letsencrypt/live/qalajob.example.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/qalajob.example.com/privkey.pem;
    include /etc/letsencrypt/options-ssl-nginx.conf;
    ssl_dhparam /etc/letsencrypt/ssl-dhparams.pem;

    client_max_body_size 20M;

    # Django media uploads
    location /media/ {
        alias /opt/QalajobAI/backend/media/;
        access_log off;
        expires 7d;
    }

    # Django static (optional — WhiteNoise also serves /static/)
    location /static/ {
        alias /opt/QalajobAI/backend/staticfiles/;
        access_log off;
        expires 30d;
    }

    # Django API + admin
    location /api/ {
        proxy_pass http://qalajob_api;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Connection "";
        proxy_read_timeout 120s;
    }

    location /admin/ {
        proxy_pass http://qalajob_api;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Connection "";
    }

    # Next.js frontend
    location / {
        proxy_pass http://qalajob_web;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
    }
}
